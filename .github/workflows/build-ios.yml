name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Uygulama Bundle ID (benzersiz bir kimlik gir)"
        required: true
        default: "com.example.muguet"
        type: string

jobs:
  build:
    runs-on: macos-15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26 or newer
        shell: bash
        run: |
          set -e

          XCODE_PATH=$(find /Applications -maxdepth 1 -type d \
            \( -name "Xcode_26*.app" -o -name "Xcode_27*.app" \) \
            | sort -V | tail -n 1)

          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi

          xcode-select -p
          xcodebuild -version

          XCODE_VERSION=$(xcodebuild -version | awk '/^Xcode / {print $2; exit}')
          XCODE_MAJOR=${XCODE_VERSION%%.*}

          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "HATA: Xcode 26 veya üstü gerekiyor."
            exit 1
          fi

