name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Rust 1.98.1 & iOS Target
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Run iOS build script
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muguet-ios-ipa
          path: build/*.ipa
