name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Run iOS build script
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: muguet-ios-ipa
          path: "**/*.ipa"
