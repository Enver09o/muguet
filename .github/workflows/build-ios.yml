name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -e

          XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name "Xcode_26*.app" | sort -V | tail -n 1)

          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26 bulunamadı!"
            ls -la /Applications | grep Xcode || true
            exit 1
          fi

          echo "Using: $XCODE_PATH"

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install xcodegen
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Install Rust 1.98.1
        shell: bash
        run: |
          set -e

          rustup toolchain install 1.98.1 --profile minimal

          # Muguet make-ios.sh bunu özellikle kullanıyor
          rustup target add aarch64-apple-ios --toolchain 1.98.1

          # Proje için Rust 1.98.1'i seç
          rustup override set 1.98.1

          echo "Rust version:"
          rustc --version

          echo "Cargo version:"
          cargo --version

          echo "Installed iOS targets:"
          rustup target list --installed --toolchain 1.98.1

      - name: Verify Rust iOS target
        shell: bash
        run: |
          set -e

          rustc +1.98.1 --version
          cargo +1.98.1 --version

          rustup target list --installed --toolchain 1.98.1 | grep "aarch64-apple-ios (installed)"

      - name: Build iOS IPA
        shell: bash
        run: |
          set -e

          chmod +x ./make-ios.sh

          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""

          ./make-ios.sh --ipa

      - name: Check IPA
        shell: bash
        run: |
          set -e

          echo "Generated files:"
          find . -name "*.ipa" -o -name "*.app"

          test -f build/Muguet.ipa

          echo "IPA found:"
          ls -lh build/Muguet.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/Muguet.ipa
          if-no-files-found: error
